<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miataness' Wishlist</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #0f1117;
        color: white;
        min-height: 100vh;
    }

    header {
        text-align: center;
        padding: 50px 20px 30px;
    }

    h1 {
        margin: 0;
        font-size: 42px;
    }

    header p {
        color: #9ca3af;
        margin-top: 10px;
    }

   .wishlist {
       width: min(1000px, 92%);
       margin: 0 auto 50px;
       display: flex;
       flex-direction: column;
       gap: 20px;
   }

   .item {
       width: 100%;
       background: #181b24;
       border: 1px solid #292e3b;
       border-radius: 16px;
       padding: 22px;
       transition: 0.2s ease;
   }

    .item:hover {
        transform: translateY(-4px);
        border-color: #5865f2;
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .item h2 {
        margin: 0 0 10px;
        font-size: 21px;
    }

    .item p {
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.5;
        min-height: 42px;
    }
   
      .price {
       color: #5865f2;
       font-size: 20px;
       font-weight: bold;
       margin-bottom: 8px;
      }

    .item a {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 16px;
        background: #5865f2;
        color: white;
        text-decoration: none;
        border-radius: 9px;
        font-weight: bold;
        transition: 0.2s;
    }

    .item a:hover {
        background: #4752c4;
    }

    footer {
        text-align: center;
        color: #666;
        padding: 20px;
        font-size: 13px;
    }
</style>
</head>

<body>

<header>
    <h1>Miataness' Wishlist</h1>
    <p>buy me shi please im broke</p>
</header>

<main class="wishlist" id="wishlist"></main>

<footer>
    Wishlist
</footer>

<script>

  //WISHLIST

    const wishlist = [
        {
            name: "AMD Ryzen 5 7600X",
            description: "New CPU, (IF YOU BUY ME THIS, I WILL ALSO NEED THE MSI MAG X870E TOMAHAWK WIFI AND (2X16) DDR5 5000hmz Corsair Vengence RAM)",
            price: "$210.99",
            link: "https://www.bestbuy.com/product/amd-ryzen-5-7600x-6-core-12-thread-4-7ghz-5-3-ghz-max-boost-socket-am5-pci-express-5-0-unlocked-desktop-processor-silver/JXKQHH52CT/sku/6519479?utm_source=feed&extStoreId=646"
        },

         {
             name: "MSI Mag X870E Tomahawk",
             description: "New Motherboard, (IF YOU BUY ME THIS, I WILL ALSO NEED THE MSI MAG X870E TOMAHAWK WIFI AND (2X16) DDR5 5000hmz Corsair Vengence RAM)",
             price: "$269.99",
             link: "https://www.bestbuy.com/product/msi-mag-x870e-tomahawk-wifi-socket-am5-amd-x870-atx-ddr5-wi-fi-7-motherboard-black/J3P7TX6LJP/sku/6616917?utm_source=feed&extStoreId=&ref=212&loc=18472327090&gclsrc=aw.ds&gad_source=1&gad_campaignid=18472338646&gclid=Cj0KCQjw7eXTBhDBARIsAKF-w447rk7DYOyPk54n54g4Khlxg9rpUIjJfCmuOECVUf982Vo3Nn5aKl0aAvp9EALw_wcB"
         },

         {
             name: "(2X16) DDR5 5000mhz Corsair Vengence RAM",
             description: "DDR5 RAM, (IF YOU BUY ME THIS, I WILL ALSO NEED THE MSI MAG X870E TOMAHAWK WIFI AND AMD RYZEN 5 7600X)",
             price: "$499.99",
             link: "https://www.corsair.com/us/en/p/memory/cmh32gx5m2b5200z40k/vengeance-rgb-32gb-2x16gb-ddr5-dram-5200mt-s-c40-amd-expo-memory-kit-cmh32gx5m2b5200z40k"
         },

         {
             name: "HyperX Cloud III",
             description: "New Headphones!",
             price: "$79.99",
             link: "https://hyperx.com/products/hyperx-cloud-iii-wired-gaming-headset?variant=43656365375645"
         },
       
         {
             name: "Full Carbon Phone Case",
             description: "Full Carbon Phone Case",
             price: "$129.99",
             link: "https://carbon-cover.de/en/products/carbon-cover-iphone-16e?variant=50455289102677"
         },
       
         {
             name: "Valve Index Rear Strap Replacement Kit",
             description: "My rear strap on my Valve Index has spring blowout, so I need to replace it!",
             price: "$119.99",
             link: "https://www.ifixit.com/products/valve-index-headset-head-strap"
         }
    ];

    const container = document.getElementById("wishlist");

    wishlist.forEach(item => {
        const card = document.createElement("div");
        card.className = "item";

   card.innerHTML = `
       <h2>${item.name}</h2>
       <div class="price">${item.price}</div>
       <p>${item.description}</p>
       <a href="${item.link}" target="_blank" rel="noopener noreferrer">
           View Item →
       </a>
   `;

        container.appendChild(card);
    });
</script>

</body>
</html>
