<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0f1117;
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 50px 20px 30px;
}

h1 {
    margin: 0;
    font-size: 42px;
}

header p {
    color: #9ca3af;
    margin-top: 10px;
}

.wishlist {
    width: min(1000px, 92%);
    margin: 0 auto 50px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.item {
    width: 100%;
    background: #181b24;
    border: 1px solid #292e3b;
    border-radius: 16px;
    padding: 22px;
    transition: 0.2s ease;
}

.item:hover {
    transform: translateY(-4px);
    border-color: #5865f2;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
}

.item h2 {
    margin: 0 0 10px;
    font-size: 21px;
}

.item p {
    color: #9ca3af;
    font-size: 14px;
    line-height: 1.5;
    min-height: 42px;
}

.price {
    color: #5865f2;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.item a {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 16px;
    background: #5865f2;
    color: white;
    text-decoration: none;
    border-radius: 9px;
    font-weight: bold;
    transition: 0.2s;
}

.item a:hover {
    background: #4752c4;
}

footer {
    text-align: center;
    color: #666;
    padding: 20px;
    font-size: 13px;
}

/* =========================
   LIVE VIEWER COUNTER
   ========================= */

#viewer-count {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #181b24;
    border: 1px solid #292e3b;
    border-radius: 10px;
    padding: 9px 13px;
    color: white;
    font-size: 14px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    z-index: 9999;
}

#viewer-number {
    font-weight: bold;
}

/* =========================
   NOTIFICATION
   ========================= */

.notification {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #181b24;
    color: white;
    border: 1px solid #292e3b;
    border-radius: 12px;
    padding: 16px 45px 16px 20px;
    min-width: 280px;
    max-width: 90vw;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);

    transform: translateX(130%);
    opacity: 0;

    transition: all 0.4s ease;

    z-index: 9999;
}

.notification.show {
    transform: translateX(0);
    opacity: 1;
}

.notification-message {
    font-weight: bold;
    font-size: 16px;
    line-height: 1.4;
}

.notification-close {
    position: absolute;
    top: 8px;
    right: 10px;

    background: transparent;
    border: none;

    color: #9ca3af;
    font-size: 22px;
    line-height: 1;

    cursor: pointer;

    padding: 2px 5px;
    border-radius: 6px;
}

.notification-close:hover {
    color: white;
    background: #292e3b;
}
</style>

</head>

<body>

<!-- LIVE VIEWER COUNTER -->

<div id="viewer-count">
    <span id="viewer-number">0</span> viewing
</div>

<header>
    <h1>Miataness' Wishlist</h1>
    <p>buy me shi please im broke</p>
</header>

<main class="wishlist" id="wishlist"></main>

    Wishlist
</footer>

<div class="notification" id="notification">

<script type="module">

/* =========================================================
   FIREBASE IMPORTS
   ========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue,
    onDisconnect,
    push,
    onChildAdded
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

import {
    getAuth,
    signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getMessaging,
    getToken,
    onMessage
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-messaging.js";


/* =========================================================
   FIREBASE CONFIG
   ========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDySpfxTWNreWliWvLWMYmZ-ojTs9AChxo",

    authDomain:
        "wishlist-4a068.firebaseapp.com",

    databaseURL:
        "https://wishlist-4a068-default-rtdb.firebaseio.com",

    projectId:
        "wishlist-4a068",

    storageBucket:
        "wishlist-4a068.firebasestorage.app",

    messagingSenderId:
        "208154215703",

    appId:
        "1:208154215703:web:ddd158ba075c7aad57a352",

    measurementId:
        "G-405630WFE4"
};


/* =========================================================
   YOUR FIREBASE WEB PUSH VAPID PUBLIC KEY
   =========================================================

   IMPORTANT:

   Replace this with your PUBLIC VAPID key from:

   Firebase Console
   → Project Settings
   → Cloud Messaging
   → Web configuration
   → Web Push certificates

   DO NOT put your private VAPID key here.
   ========================================================= */

const VAPID_PUBLIC_KEY =
    "BOjZql4o8-HB5NnpChuNG8n3XIrWpwPQH_Xy2PlhJHwbF6yj9-BwckChPdtYgXgamIDFu6KPAmGHgRFgdIn3Rck";


/* =========================================================
   INITIALIZE FIREBASE
   ========================================================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);

const auth =
    getAuth(app);


/* =========================================================
   FIREBASE CLOUD MESSAGING
   ========================================================= */

let messaging = null;

try {

    messaging =
        getMessaging(app);

} catch (error) {

    console.error(
        "Firebase Messaging initialization failed:",
        error
    );
}


/* =========================================================
   PAGE LOAD TIME
   ========================================================= */

const pageLoadedAt =
    Date.now();


/* =========================================================
   SERVICE WORKER + PUSH REGISTRATION
   ========================================================= */

async function setupPushNotifications() {

    if (!messaging) {
        return;
    }

    if (
        !("serviceWorker" in navigator) ||
        !("Notification" in window)
    ) {

        console.warn(
            "This browser does not support push notifications."
        );

        return;
    }


    if (
        VAPID_PUBLIC_KEY ===
        "PASTE_YOUR_PUBLIC_VAPID_KEY_HERE"
    ) {

        console.warn(
            "VAPID public key has not been configured."
        );

        return;
    }


    try {

        /*
         * Register Firebase's messaging service worker.
         */

    const registration = await navigator.serviceWorker.register(
        "/Wishlist/firebase-messaging-sw.js",
        {
            scope: "/Wishlist/"
        }
    );


        /*
         * Ask the visitor for notification permission.
         */

        const permission =
            await Notification.requestPermission();


        if (permission !== "granted") {

            console.log(
                "Notification permission was not granted."
            );

            return;
        }


        /*
         * Get this browser's FCM token.
         */

        const token =
            await getToken(
                messaging,
                {
                    vapidKey:
                        VAPID_PUBLIC_KEY,

                    serviceWorkerRegistration:
                        registration
                }
            );


        if (!token) {

            console.warn(
                "No FCM registration token available."
            );

            return;
        }


        console.log(
            "FCM token registered:",
            token
        );


        /*
         * Save this browser's token in Realtime Database.
         *
         * Your admin/backend can use these tokens
         * to send notifications to everyone.
         */

        const tokenRef =
            ref(
                db,
                "notificationTokens/" +
                encodeURIComponent(token)
            );


        await set(tokenRef, {

            token: token,

            createdAt:
                Date.now(),

            userAgent:
                navigator.userAgent

        });

        console.log(
            "Push notification receiver registered."
        );


    } catch (error) {

        console.error(
            "Push notification setup failed:",
            error
        );

    }

}


/* =========================================================
   FOREGROUND FCM MESSAGE
   ========================================================= */

if (messaging) {

    onMessage(
        messaging,
        (payload) => {

            console.log(
                "Foreground push received:",
                payload
            );


            const message =
                payload?.notification?.body ||
                payload?.data?.message;


            if (message) {

                showLiveNotification(
                    message
                );

            }

        }
    );

}


/* =========================================================
   ANONYMOUS LOGIN
   ========================================================= */

signInAnonymously(auth)

    .then(async () => {

        console.log(
            "Firebase anonymous login successful."
        );


        /*
         * Viewer counter
         */

        const viewersRef =
            ref(db, "viewers");


        const viewerRef =
            push(viewersRef);


        onDisconnect(viewerRef)
            .remove();


        await set(viewerRef, {

            online: true,

            timestamp:
                Date.now()

        });


        /*
         * Set up push notifications after
         * authentication is complete.
         */

        await setupPushNotifications();

    })

    .catch((error) => {

        console.error(
            "Firebase anonymous login failed:",
            error
        );

    });


/* =========================================================
   LIVE VIEWER COUNT
   ========================================================= */

const viewersRef =
    ref(db, "viewers");


onValue(
    viewersRef,
    (snapshot) => {

        const viewers =
            snapshot.val();


        const count =
            viewers
                ? Object.keys(viewers).length
                : 0;


        const viewerNumber =
            document.getElementById(
                "viewer-number"
            );


        if (viewerNumber) {

            viewerNumber.textContent =
                count;

        }

    }
);


/* =========================================================
   REALTIME DATABASE NOTIFICATIONS
   =========================================================

   This is kept in addition to FCM.

   It makes your notification popup work immediately
   when the webpage is open.
   ========================================================= */

const notificationsRef =
    ref(db, "notifications");


onChildAdded(
    notificationsRef,
    (snapshot) => {

        const notification =
            snapshot.val();


        if (!notification) {
            return;
        }


        if (!notification.message) {
            return;
        }


        /*
         * Don't display notifications that existed
         * before this page was opened.
         */

        if (
            notification.timestamp &&
            notification.timestamp <= pageLoadedAt
        ) {

            return;

        }


        showLiveNotification(
            notification.message
        );

    }
);


/* =========================================================
   SHOW LIVE POPUP
   ========================================================= */

function showLiveNotification(message) {

    const notification =
        document.getElementById(
            "notification"
        );


    const messageElement =
        document.getElementById(
            "notificationMessage"
        );


    if (
        !notification ||
        !messageElement
    ) {

        return;

    }


    messageElement.textContent =
        message;


    notification.classList.add(
        "show"
    );


    /*
     * Clear any previous timer.
     */

    if (
        notification.hideTimer
    ) {

        clearTimeout(
            notification.hideTimer
        );

    }


    notification.hideTimer =
        setTimeout(() => {

            notification.classList.remove(
                "show"
            );

        }, 8000);

}


/* =========================================================
   CLOSE POPUP
   ========================================================= */

const closeButton =
    document.getElementById(
        "notificationClose"
    );


if (closeButton) {

    closeButton.addEventListener(
        "click",
        () => {

            const notification =
                document.getElementById(
                    "notification"
                );


            notification.classList.remove(
                "show"
            );

        }
    );

}

</script>
