<style>

    body {
        margin: 0;

        background: #0f1117;
        color: white;
        min-height: 100vh;
    }

    header {
        text-align: center;

    }

    .price {
        color: #5865f2;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .item a {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 16px;
        background: #5865f2;
        color: white;
        text-decoration: none;
        border-radius: 9px;
        font-weight: bold;
        transition: 0.2s;
    }

    .item a:hover {
        background: #4752c4;
    }

    footer {
        text-align: center;
        color: #666;
        padding: 20px;
        font-size: 13px;
    }


    /* =========================
       LIVE VIEWER COUNTER
       ========================= */

    #viewer-count {
        position: fixed;
        top: 20px;
        left: 20px;

        background: #181b24;
        border: 1px solid #292e3b;
        border-radius: 10px;

        padding: 9px 13px;

        color: white;
        font-size: 14px;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);

        z-index: 9999;
    }

    #viewer-number {
        font-weight: bold;
    }


    /* =========================
       NOTIFICATION
       ========================= */

    .notification {
        position: fixed;
        bottom: 25px;
        right: 25px;
        background: #181b24;
        color: white;
        border: 1px solid #292e3b;
        border-radius: 12px;
        padding: 16px 45px 16px 20px;
        min-width: 280px;
        max-width: 90vw;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);

        transform: translateX(130%);
        opacity: 0;
        transition: all 0.4s ease;

        z-index: 9999;
    }

    .notification.show {
        transform: translateX(0);
        opacity: 1;
    }

    .notification-message {
        font-weight: bold;
        font-size: 16px;
    }

    .notification-close {
        position: absolute;
        top: 8px;
        right: 10px;

        background: transparent;
        border: none;
        color: #9ca3af;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;

        padding: 2px 5px;
        border-radius: 6px;
    }

    .notification-close:hover {
        color: white;
        background: #292e3b;
    }
</style>

</head>

<body>

<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getDatabase,
        ref,
        set,
        onValue,
        onDisconnect
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


    // Firebase configuration

    const firebaseConfig = {
        apiKey: "AIzaSyDySpfxTWNreWliWvLWMYmZ-ojTs9AChxo",
        authDomain: "wishlist-4a068.firebaseapp.com",
        databaseURL: "https://wishlist-4a068-default-rtdb.firebaseio.com",
        projectId: "wishlist-4a068",
        storageBucket: "wishlist-4a068.firebasestorage.app",
        messagingSenderId: "208154215703",
        appId: "1:208154215703:web:ddd158ba075c7aad57a352",
        measurementId: "G-405630WFE4"
    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);


    // Give every visitor a unique ID

    const viewerId = crypto.randomUUID();

    const viewerRef = ref(db, `viewers/${viewerId}`);


    // Add this visitor to the database

    set(viewerRef, {
        online: true,
        timestamp: Date.now()
    });


    // Automatically remove this visitor when they leave

    onDisconnect(viewerRef).remove();


    // Watch the viewer list

    const viewersRef = ref(db, "viewers");


    onValue(viewersRef, (snapshot) => {

        const viewers = snapshot.val();

        const count = viewers
            ? Object.keys(viewers).length
            : 0;


        const viewerNumber =
            document.getElementById("viewer-number");


        const viewerCount =
            document.getElementById("viewer-count");


        if (viewerNumber) {
            viewerNumber.textContent = count;
        }


        if (viewerCount) {

            if (count === 1) {
                viewerCount.innerHTML =
                    `<span id="viewer-number">${count}</span> viewing`;
            } else {
                viewerCount.innerHTML =
                    `<span id="viewer-number">${count}</span> viewing`;
            }

        }

    });

</script>
