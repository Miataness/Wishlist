<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wishlist Admin</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family: Arial, Helvetica, sans-serif;

        background: #0f1117;
        color: white;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 500px;
    }

    .panel {
        background: #181b24;
        border: 1px solid #292e3b;
        border-radius: 16px;

        padding: 30px;

        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
        margin: 0 0 8px;
        font-size: 30px;
    }

    .subtitle {
        color: #9ca3af;
        margin-bottom: 30px;
    }

    label {
        display: block;

        margin-bottom: 8px;

        font-weight: bold;
        font-size: 14px;
    }

    input,
    textarea {
        width: 100%;

        background: #0f1117;
        color: white;

        border: 1px solid #292e3b;
        border-radius: 9px;

        padding: 12px;

        font-family: inherit;
        font-size: 15px;

        outline: none;

        margin-bottom: 18px;
    }

    input:focus,
    textarea:focus {
        border-color: #5865f2;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    button {
        width: 100%;

        border: none;
        border-radius: 9px;

        padding: 12px 16px;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
    }

    .login-button,
    .send-button {
        background: #5865f2;
        color: white;
    }

    .login-button:hover,
    .send-button:hover {
        background: #4752c4;
    }

    .logout-button {
        background: #292e3b;
        color: white;

        margin-top: 10px;
    }

    .logout-button:hover {
        background: #3a4050;
    }

    .hidden {
        display: none;
    }

    .status {
        margin-top: 18px;

        padding: 12px;

        border-radius: 9px;

        background: #0f1117;

        color: #9ca3af;

        font-size: 14px;

        line-height: 1.4;
    }

    .success {
        color: #57f287;
    }

    .error {
        color: #ed4245;
    }

    .admin-badge {
        display: inline-block;

        background: rgba(88, 101, 242, 0.15);
        color: #7289da;

        border: 1px solid rgba(88, 101, 242, 0.3);

        padding: 5px 9px;

        border-radius: 7px;

        font-size: 12px;
        font-weight: bold;

        margin-bottom: 20px;
    }

    .char-count {
        text-align: right;

        color: #666;

        font-size: 12px;

        margin-top: -12px;
        margin-bottom: 15px;
    }
</style>

</head>

<body>

<div class="container">

<!-- =========================
     LOGIN
     ========================= -->

<div class="panel" id="loginPanel">

    <h1>Wishlist Admin</h1>

    <div class="subtitle">
        Sign in to manage the wishlist notifications.
    </div>

    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
        placeholder="Your Firebase admin email"
        autocomplete="username"
    >


    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Your Firebase password"
        autocomplete="current-password"
    >


    <button
        class="login-button"
        id="loginButton"
    >
        Sign In
    </button>


    <div
        class="status hidden"
        id="loginStatus"
    ></div>

</div>


<!-- =========================
     ADMIN PANEL
     ========================= -->

<div
    class="panel hidden"
    id="adminPanel"
>

    <div class="admin-badge">
        ADMIN MODE
    </div>

    <h1>Send Notification</h1>

    <div class="subtitle">
        Send a live notification to everyone currently viewing the wishlist.
    </div>


    <label for="message">
        Notification Message
    </label>

    <textarea
        id="message"
        maxlength="250"
    ></textarea>

    <div
        class="char-count"
        id="charCount"
    >
        0 / 250
    </div>


    <button
        class="send-button"
        id="sendButton"
    >
        Send Notification
    </button>


    <div
        class="status hidden"
        id="sendStatus"
    ></div>


    <button
        class="logout-button"
        id="logoutButton"
    >
        Sign Out
    </button>

</div>

</div>

<!-- =========================
     FIREBASE
     ========================= -->

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
        getDatabase,
        ref,
        push,
        set
    }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {

        apiKey:
            "AIzaSyDySpfxTWNreWliWvLWMYmZ-ojTs9AChxo",

        authDomain:
            "wishlist-4a068.firebaseapp.com",

        databaseURL:
            "https://wishlist-4a068-default-rtdb.firebaseio.com",

        projectId:
            "wishlist-4a068",

        storageBucket:
            "wishlist-4a068.firebasestorage.app",

        messagingSenderId:
            "208154215703",

        appId:
            "1:208154215703:web:ddd158ba075c7aad57a352",

        measurementId:
            "G-405630WFE4"
    };


    // =========================
    // INITIALIZE FIREBASE
    // =========================

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getDatabase(app);


    // =========================
    // ELEMENTS
    // =========================

    const loginPanel =
        document.getElementById("loginPanel");

    const adminPanel =
        document.getElementById("adminPanel");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const loginStatus =
        document.getElementById("loginStatus");

    const messageInput =
        document.getElementById("message");

    const sendButton =
        document.getElementById("sendButton");

    const sendStatus =
        document.getElementById("sendStatus");

    const logoutButton =
        document.getElementById("logoutButton");

    const charCount =
        document.getElementById("charCount");


    // =========================
    // STATUS HELPERS
    // =========================

    function showLoginStatus(message, type) {

        loginStatus.textContent = message;

        loginStatus.classList.remove(
            "hidden",
            "success",
            "error"
        );

        if (type) {
            loginStatus.classList.add(type);
        }
    }


    function showSendStatus(message, type) {

        sendStatus.textContent = message;

        sendStatus.classList.remove(
            "hidden",
            "success",
            "error"
        );

        if (type) {
            sendStatus.classList.add(type);
        }
    }


    // =========================
    // LOGIN
    // =========================

    loginButton.addEventListener(
        "click",
        async () => {

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            if (!email || !password) {

                showLoginStatus(
                    "Enter your email and password.",
                    "error"
                );

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent =
                "Signing in...";


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            }

            catch (error) {

                console.error(error);

                showLoginStatus(
                    "Login failed. Check your email and password.",
                    "error"
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Sign In";
            }

        }
    );


    // =========================
    // ENTER KEY LOGIN
    // =========================

    passwordInput.addEventListener(
        "keydown",
        (event) => {

            if (event.key === "Enter") {
                loginButton.click();
            }

        }
    );


    // =========================
    // AUTH STATE
    // =========================

    onAuthStateChanged(
        auth,
        (user) => {

            if (user) {

                // User is signed in.

                loginPanel.classList.add(
                    "hidden"
                );

                adminPanel.classList.remove(
                    "hidden"
                );

                console.log(
                    "Signed in UID:",
                    user.uid
                );

            }

            else {

                // Nobody is signed in.

                loginPanel.classList.remove(
                    "hidden"
                );

                adminPanel.classList.add(
                    "hidden"
                );

            }

        }
    );


    // =========================
    // SEND NOTIFICATION
    // =========================

    sendButton.addEventListener(
        "click",
        async () => {

            const message =
                messageInput.value.trim();


            if (!message) {

                showSendStatus(
                    "Type a notification first.",
                    "error"
                );

                return;
            }


            sendButton.disabled = true;

            sendButton.textContent =
                "Sending...";


            try {

                const notificationsRef =
                    ref(db, "notifications");


                // Generate a unique notification ID.

                const notificationRef =
                    push(notificationsRef);


                // Send notification to Firebase.

                await set(
                    notificationRef,
                    {
                        message: message,
                        timestamp: Date.now()
                    }
                );


                // Clear textbox.

                messageInput.value = "";

                updateCharacterCount();


                showSendStatus(
                    "✓ Notification sent to everyone viewing the site.",
                    "success"
                );

            }

            catch (error) {

                console.error(error);

                showSendStatus(
                    "Failed to send notification. Check your Firebase database rules.",
                    "error"
                );

            }


            sendButton.disabled = false;

            sendButton.textContent =
                "Send Notification";

        }
    );


    // =========================
    // CHARACTER COUNTER
    // =========================

    function updateCharacterCount() {

        charCount.textContent =
            `${messageInput.value.length} / 250`;

    }


    messageInput.addEventListener(
        "input",
        updateCharacterCount
    );


    // =========================
    // SIGN OUT
    // =========================

    logoutButton.addEventListener(
        "click",
        async () => {

            await signOut(auth);

        }
    );

</script>

</body>
</html>
